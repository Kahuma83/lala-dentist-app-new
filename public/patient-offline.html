<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173d35" />
    <title>Portal Pasien - Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f5ef; color: #173d35; font: 16px system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; text-align: center; }
      p { color: #64748b; line-height: 1.6; }
      button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 12px; background: #173d35; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Koneksi internet terputus</h1>
      <p>Portal pasien memerlukan koneksi internet untuk menjaga keamanan akun dan data klinik. Sambungkan kembali internet lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
